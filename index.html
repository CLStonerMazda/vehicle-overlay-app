<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Overlay Camera</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: black;
      color: white;
      text-align: center;
    }

    #camera-container {
      position: relative;
      width: 100%;
      max-width: 100vw;
      height: auto;
      aspect-ratio: 3 / 4;
      margin: 0 auto;
      overflow: hidden;
      touch-action: none;
      background: black;
    }

    video, #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #overlay {
      top: 6%;
      left: 6%;
      width: 88%;
      height: 88%;
      object-fit: contain;
      pointer-events: none;
      z-index: 2;
    }

    #flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      z-index: 5;
      pointer-events: none;
    }

    .flash-active {
      animation: flash-blink 0.2s ease-out;
    }

    @keyframes flash-blink {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    #vehicleType {
      margin: 10px;
      font-size: 16px;
      padding: 6px;
    }

    canvas {
      display: none;
    }

    /* Thumbnail */
    #thumbnail {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 80px;
      height: 100px;
      object-fit: cover;
      border: 2px solid white;
      cursor: pointer;
      z-index: 10;
    }

    /* Fullscreen viewer */
    #photo-viewer {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      text-align: center;
      padding-top: 20px;
      z-index: 20;
    }

    #full-photo {
      max-width: 90vw;
      max-height: 80vh;
      border: 2px solid white;
    }

    #download-link {
      display: inline-block;
      margin-top: 15px;
      font-size: 18px;
      color: #0ff;
      font-weight: bold;
      text-decoration: underline;
    }

    #close-viewer {
      position: fixed;
      top: 10px;
      right: 15px;
      font-size: 24px;
      font-weight: bold;
      background: transparent;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Vehicle Overlay Camera</h2>

  <select id="vehicleType">
    <option value="car">Car</option>
    <option value="truck">Truck</option>
    <option value="suv">SUV</option>
  </select>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <img id="overlay" src="car.png" alt="Overlay" />
    <div id="flash"></div>
  </div>

  <canvas id="canvas"></canvas>
  <img id="thumbnail" alt="Thumbnail Preview" onclick="openPhotoViewer()" />

  <div id="photo-viewer">
    <button id="close-viewer" onclick="closePhotoViewer()">✕</button>
    <img id="full-photo" alt="Captured Image" />
    <br />
    <a id="download-link" download="vehicle_photo.png">⬇️ Save Image</a>
  </div>

  <script>
    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const vehicleType = document.getElementById("vehicleType");
    const canvas = document.getElementById("canvas");
    const thumbnail = document.getElementById("thumbnail");
    const fullPhoto = document.getElementById("full-photo");
    const downloadLink = document.getElementById("download-link");
    const flash = document.getElementById("flash");
    const photoViewer = document.getElementById("photo-viewer");

    let holdTimer = null;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
      } catch (err) {
        alert("Camera access was denied or is not available.");
        console.error(err);
      }
    }

    function updateOverlay() {
      overlay.src = `${vehicleType.value}.png`;
    }

    vehicleType.addEventListener("change", updateOverlay);

    function triggerFlash() {
      flash.classList.remove("flash-active");
      void flash.offsetWidth;
      flash.classList.add("flash-active");
    }

    function takeSnapshot() {
      triggerFlash();

      const context = canvas.getContext("2d");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      const dataURL = canvas.toDataURL("image/png");

      // Set thumbnail and full viewer content
      thumbnail.src = dataURL;
      fullPhoto.src = dataURL;
      downloadLink.href = dataURL;
      thumbnail.style.display = "block";
    }

    function startHoldTimer() {
      overlay.style.visibility = 'hidden';
      holdTimer = setTimeout(() => {
        takeSnapshot();
        overlay.style.visibility = 'visible';
        holdTimer = null;
      }, 2000);
    }

    function cancelHoldTimer() {
      if (holdTimer) {
        clearTimeout(holdTimer);
        overlay.style.visibility = 'visible';
        holdTimer = null;
      }
    }

    function openPhotoViewer() {
      photoViewer.style.display = "block";
    }

    function closePhotoViewer() {
      photoViewer.style.display = "none";
    }

    document.getElementById("camera-container").addEventListener("touchstart", startHoldTimer);
    document.getElementById("camera-container").addEventListener("mousedown", startHoldTimer);
    document.getElementById("camera-container").addEventListener("touchend", cancelHoldTimer);
    document.getElementById("camera-container").addEventListener("mouseup", cancelHoldTimer);
    document.getElementById("camera-container").addEventListener("mouseleave", cancelHoldTimer);

    startCamera();
    updateOverlay();
  </script>
</body>
</html>
