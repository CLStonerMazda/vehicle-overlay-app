<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Overlay Camera</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: black;
      color: white;
      text-align: center;
    }

    h2 {
      margin-top: 10px;
    }

    #vehicleType {
      margin: 10px;
      font-size: 16px;
      padding: 6px;
    }

    #camera-container {
      position: relative;
      width: 100%;
      max-width: 100vw;
      height: auto;
      aspect-ratio: 3 / 4;
      margin: 0 auto;
      overflow: hidden;
      touch-action: none;
      background: black;
    }

    video, #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #overlay {
      top: 6%;
      left: 6%;
      width: 88%;
      height: 88%;
      object-fit: contain;
      pointer-events: none;
      z-index: 2;
    }

    #flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      z-index: 5;
      pointer-events: none;
    }

    .flash-active {
      animation: flash-blink 0.2s ease-out;
    }

    @keyframes flash-blink {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <h2>Vehicle Overlay Camera</h2>

  <select id="vehicleType">
    <option value="car">Car</option>
    <option value="truck">Truck</option>
    <option value="suv">SUV</option>
  </select>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <img id="overlay" src="car.png" alt="Overlay" />
    <div id="flash"></div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const vehicleType = document.getElementById("vehicleType");
    const canvas = document.getElementById("canvas");
    const flash = document.getElementById("flash");
    const container = document.getElementById("camera-container");

    let holdTimer = null;
    let cameraReady = false;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        video.srcObject = stream;

        video.onloadedmetadata = () => {
          cameraReady = true;
          console.log("Camera ready:", video.videoWidth, video.videoHeight);
        };
      } catch (err) {
        alert("Camera access denied or not available.");
        console.error(err);
      }
    }

    function updateOverlay() {
      overlay.src = `${vehicleType.value}.png`;
    }

    vehicleType.addEventListener("change", updateOverlay);

    function triggerFlash() {
      flash.classList.remove("flash-active");
      void flash.offsetWidth;
      flash.classList.add("flash-active");
    }

    function takeSnapshot() {
      if (!cameraReady || !video.videoWidth || !video.videoHeight) {
        alert("Camera is not ready yet. Please wait a moment.");
        return;
      }

      triggerFlash();

      const context = canvas.getContext("2d");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      const dataURL = canvas.toDataURL("image/png");
      openImagePage(dataURL);
    }

    function openImagePage(dataURL) {
      const html = `
        <html>
        <head><title>Captured Photo</title></head>
        <body style="background:black;text-align:center;color:white;font-family:sans-serif;">
          <h2>Captured Photo</h2>
          <img src="${dataURL}" style="max-width:95vw;max-height:80vh;border:2px solid white;" />
          <br><br>
          <a href="${dataURL}" download="vehicle_photo.png" style="font-size:20px;color:#0ff;text-decoration:underline;">⬇️ Save Image</a>
        </body>
        </html>
      `;
      const newTab = window.open();
      newTab.document.write(html);
      newTab.document.close();
    }

    function startHoldTimer() {
      overlay.style.visibility = 'hidden';
      holdTimer = setTimeout(() => {
        takeSnapshot();
        overlay.style.visibility = 'visible';
        holdTimer = null;
      }, 2000); // 2 second hold
    }

    function cancelHoldTimer() {
      if (holdTimer) {
        clearTimeout(holdTimer);
        overlay.style.visibility = 'visible';
        holdTimer = null;
      }
    }

    container.addEventListener("touchstart", startHoldTimer);
    container.addEventListener("mousedown", startHoldTimer);
    container.addEventListener("touchend", cancelHoldTimer);
    container.addEventListener("mouseup", cancelHoldTimer);
    container.addEventListener("mouseleave", cancelHoldTimer);

    startCamera();
    updateOverlay();
  </script>
</body>
</html>
