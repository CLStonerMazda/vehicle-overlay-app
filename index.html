<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Vehicle Overlay Camera</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      font-family: sans-serif;
      color: white;
      text-align: center;
    }

    #camera-container {
      position: relative;
      width: 100%;
      max-width: 100vw;
      height: auto;
      aspect-ratio: 3 / 4;
      margin: 0 auto;
      overflow: hidden;
      background: black;
      touch-action: none;
    }

    video, #overlay, #flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #overlay {
      top: 6%;
      left: 6%;
      width: 88%;
      height: 88%;
      object-fit: contain;
      pointer-events: none;
      z-index: 2;
    }

    #flash {
      background: white;
      opacity: 0;
      z-index: 5;
      pointer-events: none;
    }

    .flash-active {
      animation: flash-blink 0.2s ease-out;
    }

    @keyframes flash-blink {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    #vehicleType {
      margin: 10px auto;
      font-size: 16px;
      padding: 6px;
      display: block;
    }

    #photo-container {
      display: none;
      text-align: center;
      background: black;
      padding: 20px;
    }

    #snapshot {
      max-width: 95vw;
      max-height: 80vh;
      border: 2px solid white;
    }

    #download-link {
      display: inline-block;
      margin-top: 15px;
      font-size: 18px;
      color: #0ff;
      font-weight: bold;
      text-decoration: underline;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <h2>Vehicle Overlay Camera</h2>

  <select id="vehicleType">
    <option value="car">Car</option>
    <option value="truck">Truck</option>
    <option value="suv">SUV</option>
  </select>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <img id="overlay" src="car.png" alt="Overlay" />
    <div id="flash"></div>
  </div>

  <div id="photo-container">
    <h3>Captured Photo</h3>
    <img id="snapshot" alt="Captured Image" />
    <br />
    <a id="download-link" download="vehicle_photo.png">⬇️ Save Image</a>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const vehicleType = document.getElementById("vehicleType");
    const canvas = document.getElementById("canvas");
    const snapshot = document.getElementById("snapshot");
    const downloadLink = document.getElementById("download-link");
    const flash = document.getElementById("flash");
    const container = document.getElementById("camera-container");
    const photoContainer = document.getElementById("photo-container");

    let holdTimer = null;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
      } catch (err) {
        alert("Camera access was denied or is not available.");
        console.error(err);
      }
    }

    function updateOverlay() {
      overlay.src = `${vehicleType.value}.png`;
    }

    vehicleType.addEventListener("change", updateOverlay);

    function triggerFlash() {
      flash.classList.remove("flash-active");
      void flash.offsetWidth;
      flash.classList.add("flash-active");
    }

    function takeSnapshot() {
      triggerFlash();

      const context = canvas.getContext("2d");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      const dataURL = canvas.toDataURL("image/png");
      snapshot.src = dataURL;
      downloadLink.href = dataURL;

      container.style.display = "none";
      photoContainer.style.display = "block";
    }

    function startHoldTimer() {
      overlay.style.visibility = 'hidden';
      holdTimer = setTimeout(() => {
        takeSnapshot();
        overlay.style.visibility = 'visible';
        holdTimer = null;
      }, 2000);
    }

    function cancelHoldTimer() {
      if (holdTimer) {
        clearTimeout(holdTimer);
        overlay.style.visibility = 'visible';
        holdTimer = null;
      }
    }

    container.addEventListener("touchstart", startHoldTimer);
    container.addEventListener("mousedown", startHoldTimer);
    container.addEventListener("touchend", cancelHoldTimer);
    container.addEventListener("mouseup", cancelHoldTimer);
    container.addEventListener("mouseleave", cancelHoldTimer);

    startCamera();
    updateOverlay();
  </script>
</body>
</html>
